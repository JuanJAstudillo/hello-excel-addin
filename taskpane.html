<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sales Analysis</title>

    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>

<body>

    <h2>Sales Analysis</h2>

    <button id="analyseButton">
        Analyse SalesData
    </button>

    <br><br>

    <button id="writeButton">
        Write Results to Excel
    </button>

    <h3>Results</h3>

    <p id="rows">Rows: -</p>
    <p id="total">Total quantity: -</p>
    <p id="average">Average quantity: -</p>

    <p id="message"></p>

    <script>

        let analysisResults = null;

        Office.onReady(() => {

            document.getElementById("analyseButton").onclick =
                analyseSales;

            document.getElementById("writeButton").onclick =
                writeResults;

        });


        async function analyseSales() {

            await Excel.run(async (context) => {

                const table =
                    context.workbook.tables.getItem("SalesData");

                const headerRange =
                    table.getHeaderRowRange();

                const dataRange =
                    table.getDataBodyRange();

                headerRange.load("values");
                dataRange.load("values");

                await context.sync();

                const headers = headerRange.values[0];
                const rows = dataRange.values;

                const quantityColumn =
                    headers.indexOf("Quantity");

                if (quantityColumn === -1) {

                    document.getElementById("message").innerText =
                        'Column "Quantity" was not found.';

                    return;
                }

                let totalQuantity = 0;

                for (let i = 0; i < rows.length; i++) {

                    const quantity =
                        Number(rows[i][quantityColumn]);

                    if (!isNaN(quantity)) {
                        totalQuantity += quantity;
                    }

                }

                const numberOfRows = rows.length;

                const averageQuantity =
                    numberOfRows > 0
                    ? totalQuantity / numberOfRows
                    : 0;


                analysisResults = {
                    rows: numberOfRows,
                    total: totalQuantity,
                    average: averageQuantity
                };


                document.getElementById("rows").innerText =
                    "Rows: " + numberOfRows;

                document.getElementById("total").innerText =
                    "Total quantity: " + totalQuantity;

                document.getElementById("average").innerText =
                    "Average quantity: " +
                    averageQuantity.toFixed(2);

                document.getElementById("message").innerText =
                    "Analysis complete.";

            });

        }


        async function writeResults() {

            if (analysisResults === null) {

                document.getElementById("message").innerText =
                    "Run the analysis first.";

                return;
            }

            await Excel.run(async (context) => {

                let resultsSheet =
                    context.workbook.worksheets
                    .getItemOrNullObject("Results");

                resultsSheet.load("isNullObject");

                await context.sync();


                if (resultsSheet.isNullObject) {

                    resultsSheet =
                        context.workbook.worksheets
                        .add("Results");

                }


                const output =
                    resultsSheet.getRange("A1:B4");

                output.values = [

                    ["Metric", "Value"],

                    ["Number of rows",
                        analysisResults.rows],

                    ["Total quantity",
                        analysisResults.total],

                    ["Average quantity",
                        analysisResults.average]

                ];


                output.format.autofitColumns();

                resultsSheet.activate();

                await context.sync();


                document.getElementById("message").innerText =
                    "Results written to Excel.";

            });

        }

    </script>

</body>
</html>
