<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Hello Excel</title>

    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>

<body>

    <h1>Sales Add-in</h1>

    <button id="readCellButton">
        Read selected cell
    </button>

    <br><br>

    <button id="readTableButton">
        Read SalesData table
    </button>

    <p id="result">
        Results will appear here.
    </p>

    <script>

        Office.onReady(() => {

            document.getElementById("readCellButton").onclick =
                readSelectedCell;

            document.getElementById("readTableButton").onclick =
                readSalesTable;

        });


        async function readSelectedCell() {

            await Excel.run(async (context) => {

                const range =
                    context.workbook.getSelectedRange();

                range.load("values");

                await context.sync();

                const value = range.values[0][0];

                document.getElementById("result").innerText =
                    "Selected value: " + value;

            });

        }


        async function readSalesTable() {

            await Excel.run(async (context) => {

                const table =
                    context.workbook.tables.getItem("SalesData");

                const headerRange =
                    table.getHeaderRowRange();

                const dataRange =
                    table.getDataBodyRange();

                headerRange.load("values");
                dataRange.load("values");

                await context.sync();

                const headers = headerRange.values[0];
                const rows = dataRange.values;

                let output = "";

                output += "Columns: " + headers.join(", ") + "\n\n";

                output += "Rows found: " + rows.length + "\n\n";

                for (let i = 0; i < rows.length; i++) {

                    output += rows[i].join(" | ") + "\n";

                }

                document.getElementById("result").innerText = output;

            });

        }

    </script>

</body>
</html>
