<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sales API Test</title>

    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>

<body>

    <h2>Sales API Test</h2>

    <button id="loadButton">
        Load Sales Data
    </button>

    <br><br>

    <button id="writeButton">
        Write Data to Excel
    </button>

    <h3>Results</h3>

    <p id="rows">Rows: -</p>
    <p id="total">Total quantity: -</p>
    <p id="average">Average quantity: -</p>
    <p id="message"></p>

    <script>

        let salesData = [];

        Office.onReady(() => {

            document.getElementById("loadButton").onclick =
                loadSales;

            document.getElementById("writeButton").onclick =
                writeSalesToExcel;

        });


        async function loadSales() {

            try {

                const response = await fetch(
                    "https://sales-api-test-dsdl.onrender.com/sales?months=12"
                );

                const result = await response.json();
                
                salesData = result.sales;

                let totalQuantity = 0;

                for (let i = 0; i < salesData.length; i++) {

                    const quantity =
                        Number(salesData[i].Quantity);

                    if (!isNaN(quantity)) {
                        totalQuantity += quantity;
                    }

                }

                const numberOfRows =
                    salesData.length;

                const averageQuantity =
                    numberOfRows > 0
                    ? totalQuantity / numberOfRows
                    : 0;


                document.getElementById("rows").innerText =
                    "Rows: " + numberOfRows;

                document.getElementById("total").innerText =
                    "Total quantity: " + totalQuantity;

                document.getElementById("average").innerText =
                    "Average quantity: " +
                    averageQuantity.toFixed(2);

                document.getElementById("message").innerText =
                    "Sales data loaded successfully.";

            }

            catch (error) {

                document.getElementById("message").innerText =
                    error.message;

            }

        }


        async function writeSalesToExcel() {

            if (salesData.length === 0) {

                document.getElementById("message").innerText =
                    "Load the sales data first.";

                return;
            }


            await Excel.run(async (context) => {

                let sheet =
                    context.workbook.worksheets
                    .getItemOrNullObject("SalesData");

                sheet.load("isNullObject");

                await context.sync();


                if (sheet.isNullObject) {

                    sheet =
                        context.workbook.worksheets
                        .add("SalesData");

                }


                const output = [
                    ["ItemCode", "InvoiceDate", "Quantity"]
                ];


                for (let i = 0; i < salesData.length; i++) {

                    output.push([
                        salesData[i].ItemCode,
                        salesData[i].InvoiceDate,
                        salesData[i].Quantity
                    ]);

                }


                const rowCount =
                    output.length;

                const range =
                    sheet.getRangeByIndexes(
                        0,
                        0,
                        rowCount,
                        3
                    );

                range.values = output;

                range.format.autofitColumns();

                sheet.activate();

                await context.sync();


                document.getElementById("message").innerText =
                    "Sales data written to Excel.";

            });

        }

    </script>

</body>
</html>
